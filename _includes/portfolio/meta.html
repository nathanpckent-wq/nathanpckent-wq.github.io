<!-- Meta -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{"/assets/images/portfolio/photo.png"}}">

<!-- Social sharing -->
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{"/assets/images/portfolio/photo.png"}}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{"/assets/images/portfolio/photo.png"}}">
<meta name="twitter:card" content="summary_large_image">

<!-- Favicon -->
<link rel="icon" href="{{"/assets/images/portfolio/favicon.ico"}}" type="image/jpg" sizes="16x16">

<!-- FontAwesome -->
<script src="https://kit.fontawesome.com/ee90909ebd.js" crossorigin="anonymous"></script>

<title>{{ page.title }}</title>

<link rel="stylesheet" href="{{ "/assets/css/portfolio/main.min.css" | relative_url }}">
<link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

<!-- Google Analytics -->
{% include analytics.html %}
