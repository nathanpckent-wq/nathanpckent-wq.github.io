<section class="py-20 px-6 bg-slate-50">
  <div class="max-w-7xl mx-auto">
    <h2 class="text-5xl md:text-6xl font-bold text-slate-900 mb-16">
      Testimonials<span>.</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-start">
      {% assign rotations = "-3deg,2deg,-2deg,3deg" | split: "," %}
      {% for testimonial in site.data.nathantics.testimonials %}
      {% assign rot_index = forloop.index0 | modulo: 4 %}
      {% assign rot = rotations[rot_index] %}
      <div class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 hover:border-slate-200"
           style="transform: rotate({{ rot }}); transition: transform 0.3s ease, box-shadow 0.3s ease;"
           onmouseover="this.style.transform='rotate(0deg)'"
           onmouseout="this.style.transform='rotate({{ rot }})'">
        <svg class="w-8 h-8 text-slate-200 mb-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.3 5.1a9.9 9.9 0 0 0-5.4 8.8H9v5.1H3.9V14a12 12 0 0 1 5.5-10.2zm9.8 0a9.9 9.9 0 0 0-5.4 8.8H19v5.1h-5.1V14a12 12 0 0 1 5.5-10.2z"/>
        </svg>
        <p class="text-slate-600 leading-relaxed italic">
          "{{ testimonial }}"
        </p>
<!--        <p class="text-slate-400 text-sm font-medium mt-4 not-italic">— </p>-->
      </div>
      {% endfor %}
    </div>
  </div>
</section>
