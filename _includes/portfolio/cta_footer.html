<section class="bg-slate-900 py-24 px-6">
  <div class="max-w-7xl mx-auto text-center flex flex-col items-center gap-8">

    <!-- Animated email icon -->
    <div id="email-swoosh" style="opacity:0; transform: translateX(-80px) rotate(-30deg); transition: none;">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-blue-400" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      <!-- Swirl trail -->
      <svg class="absolute -top-4 -left-6 w-16 h-16 text-blue-400/30" viewBox="0 0 60 60" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M10 50 Q30 10 50 30 Q60 40 40 50" stroke="currentColor" stroke-width="1.5"
              stroke-dasharray="4 4" fill="none"/>
      </svg>
    </div>

    <h2 class="text-5xl md:text-6xl font-bold text-white">
      Let's start the conversation.
    </h2>
    <p class="text-lg text-slate-400 max-w-xl">
      Small changes can create big results. Let's talk about what's possible for your organization.
    </p>
    <a href="{{ site.data.nathantics.landingPage.cta.link }}"
       class="inline-block py-4 px-10 rounded-xl text-slate-900 bg-white font-bold text-lg hover:bg-slate-100 transition-colors duration-200">
      Book a Free 20-Minute Discovery Call
    </a>
  </div>
</section>

<style>
  @keyframes swoopIn {
    0%   { opacity: 0; transform: translateX(-80px) translateY(20px) rotate(-30deg); }
    60%  { opacity: 1; transform: translateX(8px) translateY(-4px) rotate(5deg); }
    80%  { transform: translateX(-4px) translateY(2px) rotate(-2deg); }
    100% { opacity: 1; transform: translateX(0) translateY(0) rotate(0deg); }
  }
  @keyframes swirl {
    0%   { stroke-dashoffset: 40; opacity: 0; }
    40%  { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  #email-swoosh { position: relative; }
  #email-swoosh svg:last-child path { animation: swirl 1s ease-out forwards; }
</style>

<script>
  const target = document.getElementById('email-swoosh');
  const observer = new IntersectionObserver(([entry]) => {
    if (entry.isIntersecting) {
      target.style.animation = 'none';
      target.offsetHeight; // force reflow
      target.style.animation = 'swoopIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards';
    } else {
      target.style.animation = 'none';
      target.style.opacity = '0';
      target.style.transform = 'translateX(-80px) rotate(-30deg)';
    }
  }, { threshold: 0.3 });
  observer.observe(target);
</script>
