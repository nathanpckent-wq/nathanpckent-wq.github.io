<h2 class="text-5xl lg:text-6xl font-bold p-8 md:p-16 w-full">Services<span class="text-charcoal-500">.</span></h2>
<div class="h-fit px-8 md:px-16">
  <div class="flex flex-row justify-evenly gap-4">
    {% for service in site.data.nathantics.services %}
    <div class="flex gap-4 w-1/3">
      <p class="rounded-full p-4 bg-black text-white h-10 w-10 flex flex-col align-middle justify-center">{{ service.index }}</p>
      <div class="flex flex-col gap-2">
        <p class="text-xl !italic">{{ service.title }}</p>
        <p class="text-md !italic">{{ service.description }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
