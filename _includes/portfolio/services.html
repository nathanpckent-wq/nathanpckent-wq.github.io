<section class="py-20 px-6 bg-white">
  <div class="max-w-7xl mx-auto">
    <h2 class="text-5xl md:text-6xl font-bold text-slate-900 mb-16">
      Services.
    </h2>

    <div class="grid md:grid-cols-3 gap-8">
      {% for service in site.data.nathantics.services %}
      <div class="group">
        <div class="flex items-start gap-4 mb-6">
          <div class="flex-shrink-0 w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center">
            <span class="text-white font-semibold">{{service.index}}</span>
          </div>
          <h3 class="text-xl font-bold text-slate-900 pt-1 italic">
            {{service.title}}
          </h3>
        </div>

        <p class="text-slate-600 leading-relaxed italic ml-16">
          {{service.description}}
        </p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
